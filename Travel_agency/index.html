<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Tail & Trail</title>
    <!--custom css-->
    <link rel="stylesheet" href="css/style.css">
    <!--custom js-->
    <script src="js/script.js"></script>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <!--navgation section-->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
                <a class="nav-link" href="#">HOME</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">ABOUT</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">CONTACT ME</a>
            </li>
            </ul>

            <a class="navbar-brand logo-center d-none d-lg-block" href="#">
            <div class="logo-circle">
                <img src="assets/images/travel_tales.jpg" alt="Travel Tales & Trail" class="img-fluid">
            </div>
            </a>

            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item">
                <a class="nav-link" href="#">DESTINATIONS</a>
            </li>
            </ul>

            <div class="d-flex search-box ms-3">
            <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
            <button class="btn btn-outline-success" type="submit">Search</button>
            </div>

        </div>
    </nav>

    <!--Hero section-->
            
    <div class="container-hero">
        <Section class="hero" role="banner" aria-label="promational section">
                <div class="hero-overlay-container">
                    <div class="hero-content">
                        <h1>OFF THE BEATEN PATH ADVENTURES</h1>
                        <a href="#" class="btn">READ FULL STORY</a>
                    </div>

                </div>
        </Section>  
    </div>  

    <!-- Main container for the entire page content -->
    <div class="container-fluid d-flex flex-column p-0 mb-0">

        <!-- Header section with a blue background -->
        <header class="header-bg text-blue rounded-3 shadow-lg d-flex flex-column flex-md-row align-items-center justify-content-between">
            <h4 class="display-4 fw-bold mb-md-0">#Travel Tail & Trail</h4>
            <div class="row g-4 justify-content-center">

                <!-- Individual Image Card -->
                <!-- The responsive grid classes ensure it adapts to different screen sizes. -->
                <!-- It shows 1 column on extra-small, 2 on small, 3 on medium, and 5 on large screens. -->
                <div class="col-12 col-sm-6 col-md-4 col-lg-2 p-0">
                    <div class="image-container">
                        <img src="assets/images/image1.jpg" 
                             alt="picture of valley"
                             class="ghandruk valley">
                        <div class="image-overlay fs-5">@dominik.kobler</div>
                    </div>
                </div>

                <!-- Individual Image Card -->
                <div class="col-12 col-sm-6 col-md-4 col-lg-2 p-0">
                    <div class="image-container">
                        <img src="assets/images/image2.jpg" 
                             alt="photography of mountain"
                             class="w-100 rounded-3">
                        <div class="image-overlay fs-5">@mountain</div>
                    </div>
                </div>

                <!-- Individual Image Card -->
                <div class="col-12 col-sm-6 col-md-4 col-lg-2 p-0">
                    <div class="image-container">
                        <img src="assets/images/images3.jpg" 
                             alt="swoyembunath temple"
                             class="w-100 rounded-3">
                        <div class="image-overlay fs-5">@swoyembunath</div>
                    </div>
                </div>

                <!-- Individual Image Card -->
                <div class="col-12 col-sm-6 col-md-4 col-lg-2 p-0">
                    <div class="image-container">
                        <img src="assets/images/images4.jpg" 
                             alt="paragliding"
                             class="w-100 rounded-3">
                        <div class="image-overlay fs-5">@paragliding</div>
                    </div>
                </div>

                <!-- Individual Image Card -->
                <div class="col-12 col-sm-6 col-md-4 col-lg-2 p-0">
                    <div class="image-container">
                        <img src="assets/images/image6.jpg" 
                             alt="boating on a lake"
                             class="w-100 rounded-3">
                        <div class="image-overlay fs-5">@boating</div>
                    </div>
                </div>

            </div>
        </header>

        

    </div>

    



</body>
</html>
